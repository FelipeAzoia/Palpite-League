<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1980" viewBox="0 0 1680 1980" role="img" aria-labelledby="title desc">
  <title id="title">Modelo Conceitual de Domínio — Palpite League</title>
  <desc id="desc">Diagrama com os 14 conceitos do modelo textual, Bolão como nome canônico, relacionamentos e multiplicidades. Valores financeiros são de teste ou simulação.</desc>
  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243447; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 17px; fill: #526579; }
      .node { fill: #fff; stroke: #294766; stroke-width: 2; rx: 9; }
      .head { fill: #294766; }
      .name { fill: #fff; font-weight: 700; font-size: 18px; }
      .attr { font-family: monospace; font-size: 14px; }
      .edge { fill: none; stroke: #60758a; stroke-width: 2; }
      .composition { fill: none; stroke: #294766; stroke-width: 2.5; }
      .label { font-size: 13px; fill: #344b61; }
      .mult { font-size: 12px; font-weight: 700; fill: #21384f; }
      .note { fill: #fff8df; stroke: #c59d35; stroke-width: 1.5; rx: 8; }
      .noteText { font-size: 14px; }
    </style>
    <marker id="diamond" markerWidth="14" markerHeight="12" refX="7" refY="6" orient="auto">
      <path d="M7,1 L13,6 L7,11 L1,6 Z" fill="#294766"/>
    </marker>
  </defs>

  <rect width="1680" height="1980" fill="#f7f9fc"/>
  <text class="title" x="840" y="45" text-anchor="middle">Palpite League — Modelo Conceitual de Domínio</text>
  <text class="subtitle" x="840" y="76" text-anchor="middle">Alinhado ao modelo textual; Bolão é o termo canônico (não “Liga”)</text>

  <!-- Associations are placed behind the concepts. -->
  <g class="edge">
    <path d="M700 220 C590 280 390 310 220 390"/>
    <path d="M930 220 L1080 350"/>
    <path d="M990 150 L1370 150"/>
    <path d="M720 220 L760 270 L760 660 L850 700"/>
    <path d="M980 190 L1660 270 L1660 430 L1640 450"/>
    <path d="M600 505 L600 650 L500 750"/>
    <path d="M1290 470 L1380 470"/>
    <path d="M1290 540 L1335 610 L1650 610 L1650 1450 L1420 1540"/>
    <path d="M910 560 L780 650 L700 750"/>
    <path d="M820 860 L720 940 L660 1150 L660 1230"/>
    <path d="M1000 940 L1000 1190"/>
    <path d="M820 900 L760 1000 L760 1540 L820 1580"/>
    <path d="M1100 1255 L1130 1255"/>
    <path d="M1100 1610 L1030 1660"/>
    <path d="M1170 1700 L1470 1760"/>
    <path d="M1350 1700 L1570 1760"/>
    <path d="M470 750 C390 650 290 570 220 525"/>
  </g>

  <g class="composition">
    <path d="M760 220 L600 390" marker-start="url(#diamond)"/>
    <path d="M900 600 L900 700" marker-start="url(#diamond)"/>
    <path d="M1240 1340 L1240 1510" marker-start="url(#diamond)"/>
  </g>

  <!-- Multiplicities and relationship names -->
  <g>
    <text class="label" x="440" y="315">contrata</text><text class="mult" x="245" y="375">0..*</text><text class="mult" x="720" y="255">1</text>
    <text class="label" x="660" y="315">possui</text><text class="mult" x="615" y="375">1</text><text class="mult" x="615" y="535">1</text>
    <text class="label" x="1010" y="285">cria</text><text class="mult" x="940" y="245">1</text><text class="mult" x="1080" y="340">0..*</text>
    <text class="label" x="1150" y="135">recebe</text><text class="mult" x="1010" y="210">1</text><text class="mult" x="1350" y="145">0..*</text>
    <text class="label" x="765" y="480">possui participações</text><text class="mult" x="745" y="255">1</text><text class="mult" x="850" y="695">0..*</text>
    <text class="label" x="1350" y="285">convidado</text><text class="mult" x="1000" y="210">1</text><text class="mult" x="1400" y="425">0..*</text>
    <text class="label" x="615" y="635">registra</text><text class="mult" x="610" y="515">1</text><text class="mult" x="500" y="745">0..*</text>
    <text class="label" x="1310" y="455">gera</text><text class="mult" x="1280" y="465">1</text><text class="mult" x="1380" y="465">0..*</text>
    <text class="label" x="915" y="660">contém</text><text class="mult" x="920" y="595">1</text><text class="mult" x="865" y="695">1..*</text>
    <text class="label" x="1480" y="1000">seleciona</text><text class="mult" x="1295" y="530">0..*</text><text class="mult" x="1420" y="1530">0..*</text>
    <text class="label" x="800" y="635">referencia (opcional)</text><text class="mult" x="900" y="575">0..1</text><text class="mult" x="700" y="745">0..*</text>
    <text class="label" x="690" y="1080">solicita</text><text class="mult" x="830" y="925">1</text><text class="mult" x="645" y="1225">0..*</text>
    <text class="label" x="1010" y="1070">conquista</text><text class="mult" x="985" y="950">1</text><text class="mult" x="1005" y="1185">0..*</text>
    <text class="label" x="765" y="1250">registra</text><text class="mult" x="815" y="920">1</text><text class="mult" x="810" y="1575">0..*</text>
    <text class="label" x="1080" y="1240">referente a</text><text class="mult" x="1090" y="1250">0..*</text><text class="mult" x="1128" y="1250">1</text>
    <text class="label" x="1250" y="1430">contém</text><text class="mult" x="1245" y="1345">1</text><text class="mult" x="1245" y="1505">1..*</text>
    <text class="label" x="1050" y="1640">recebe</text><text class="mult" x="1090" y="1605">1</text><text class="mult" x="1035" y="1655">0..*</text>
    <text class="label" x="1360" y="1725">mandante</text><text class="mult" x="1170" y="1695">0..*</text><text class="mult" x="1460" y="1755">1</text>
    <text class="label" x="1430" y="1745">visitante</text><text class="mult" x="1350" y="1695">0..*</text><text class="mult" x="1560" y="1755">1</text>
    <text class="label" x="300" y="640">referencia (opcional)</text><text class="mult" x="225" y="540">0..*</text><text class="mult" x="485" y="745">0..1</text>
  </g>

  <!-- Concepts -->
  <g transform="translate(650 110)">
    <rect class="node" width="340" height="110"/><rect class="head" width="340" height="36" rx="8"/>
    <text class="name" x="170" y="25" text-anchor="middle">Usuario</text>
    <text class="attr" x="14" y="60">id, nome, email</text><text class="attr" x="14" y="83">plano, status</text>
  </g>
  <g transform="translate(60 390)">
    <rect class="node" width="320" height="135"/><rect class="head" width="320" height="36" rx="8"/>
    <text class="name" x="160" y="25" text-anchor="middle">Assinatura</text>
    <text class="attr" x="14" y="62">id, vigência</text><text class="attr" x="14" y="86">status, valorCobranca</text>
    <text class="attr" x="14" y="110">pagamento de teste</text>
  </g>
  <g transform="translate(470 390)">
    <rect class="node" width="260" height="115"/><rect class="head" width="260" height="36" rx="8"/>
    <text class="name" x="130" y="25" text-anchor="middle">Carteira</text>
    <text class="attr" x="14" y="66">id, saldoSimulado</text>
    <text class="attr" x="14" y="91">sem dinheiro real</text>
  </g>
  <g transform="translate(900 350)">
    <rect class="node" width="390" height="250"/><rect class="head" width="390" height="36" rx="8"/>
    <text class="name" x="195" y="25" text-anchor="middle">Bolão</text>
    <text class="attr" x="14" y="62">id, nome, período</text><text class="attr" x="14" y="86">taxaEntrada, modeloPremiacao</text>
    <text class="attr" x="14" y="110">criterioDesempate, status</text><text class="attr" x="14" y="134">resultadoAoVivo</text>
    <text class="attr" x="14" y="166">regras definidas na criação</text><text class="attr" x="14" y="190">e imutáveis</text>
  </g>
  <g transform="translate(1370 100)">
    <rect class="node" width="270" height="140"/><rect class="head" width="270" height="36" rx="8"/>
    <text class="name" x="135" y="25" text-anchor="middle">Notificação</text>
    <text class="attr" x="14" y="65">id, tipo, mensagem</text><text class="attr" x="14" y="89">dataEnvio, lida</text>
  </g>
  <g transform="translate(1380 430)">
    <rect class="node" width="260" height="120"/><rect class="head" width="260" height="36" rx="8"/>
    <text class="name" x="130" y="25" text-anchor="middle">Convite</text>
    <text class="attr" x="14" y="65">id, codigo, status</text><text class="attr" x="14" y="90">dataCriacao</text>
  </g>
  <g transform="translate(320 750)">
    <rect class="node" width="360" height="200"/><rect class="head" width="360" height="36" rx="8"/>
    <text class="name" x="180" y="25" text-anchor="middle">Movimentação Financeira</text>
    <text class="attr" x="14" y="63">id, tipo, valor, data, status</text><text class="attr" x="14" y="87">origem / identificador externo</text>
    <text class="attr" x="14" y="123">referencia opcionalmente</text><text class="attr" x="14" y="147">Bolão ou Assinatura</text>
    <text class="attr" x="14" y="174">registro auditável de teste</text>
  </g>
  <g transform="translate(820 700)">
    <rect class="node" width="360" height="240"/><rect class="head" width="360" height="36" rx="8"/>
    <text class="name" x="180" y="25" text-anchor="middle">Participação</text>
    <text class="attr" x="14" y="63">id, papel, status, dataEntrada</text><text class="attr" x="14" y="87">entradaTardia, aceiteRegrasEm</text>
    <text class="attr" x="14" y="111">pontuacaoTotal</text><text class="attr" x="14" y="135">pagamentoConfirmado</text>
    <text class="attr" x="14" y="174">uma participação por usuário</text><text class="attr" x="14" y="198">e por bolão</text>
  </g>
  <g transform="translate(320 1170)">
    <rect class="node" width="340" height="140"/><rect class="head" width="340" height="36" rx="8"/>
    <text class="name" x="170" y="25" text-anchor="middle">Solicitação de Devolução</text>
    <text class="attr" x="14" y="65">id, status, dataSolicitacao</text><text class="attr" x="14" y="90">dataResposta</text>
    <text class="attr" x="14" y="115">exige aprovação administrativa</text>
  </g>
  <g transform="translate(870 1190)">
    <rect class="node" width="260" height="130"/><rect class="head" width="260" height="36" rx="8"/>
    <text class="name" x="130" y="25" text-anchor="middle">Medalha</text>
    <text class="attr" x="14" y="66">id, dataConcessao</text>
    <text class="attr" x="14" y="96">todos os empatados</text>
  </g>
  <g transform="translate(1100 1170)">
    <rect class="node" width="280" height="170"/><rect class="head" width="280" height="36" rx="8"/>
    <text class="name" x="140" y="25" text-anchor="middle">Rodada</text>
    <text class="attr" x="14" y="65">id, numero</text><text class="attr" x="14" y="90">dataInicio, dataFim</text>
  </g>
  <g transform="translate(650 1580)">
    <rect class="node" width="380" height="190"/><rect class="head" width="380" height="36" rx="8"/>
    <text class="name" x="190" y="25" text-anchor="middle">Palpite</text>
    <text class="attr" x="14" y="64">id, tipo, resultado ou placar</text><text class="attr" x="14" y="89">pontosGanhos, dataEnvio</text>
    <text class="attr" x="14" y="126">um tipo de palpite por partida</text>
  </g>
  <g transform="translate(1100 1510)">
    <rect class="node" width="320" height="190"/><rect class="head" width="320" height="36" rx="8"/>
    <text class="name" x="160" y="25" text-anchor="middle">Partida</text>
    <text class="attr" x="14" y="64">id, dataHora, status</text><text class="attr" x="14" y="89">placarCasa, placarVisitante</text>
    <text class="attr" x="14" y="126">resultado oficial da API</text>
  </g>
  <g transform="translate(1440 1760)">
    <rect class="node" width="220" height="120"/><rect class="head" width="220" height="36" rx="8"/>
    <text class="name" x="110" y="25" text-anchor="middle">Time</text>
    <text class="attr" x="14" y="66">id, nome, escudo</text>
  </g>

  <rect class="note" x="55" y="1460" width="480" height="135"/>
  <text class="noteText" x="75" y="1494" font-weight="700">Leitura das relações</text>
  <text class="noteText" x="75" y="1522">• Bolão contém participações e seleciona partidas.</text>
  <text class="noteText" x="75" y="1548">• Cada transação referencia no máximo um Bolão ou</text>
  <text class="noteText" x="92" y="1572">uma Assinatura; a origem deve ser rastreável.</text>
  <text class="noteText" x="75" y="1618">Composição indicada por losango preenchido.</text>

  <text class="subtitle" x="840" y="1930" text-anchor="middle">Fonte editável: modelo-conceitual-dominio.mmd · PNG original mantido como legado</text>
</svg>
